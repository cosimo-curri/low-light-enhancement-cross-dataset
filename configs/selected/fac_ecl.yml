# Selected from historical multi-seed validation (rank 1).
# Single selected configuration for a seed-1 training run.
experiment:
  name: fac_ecl_selected_retrain_seed_1
  seed: 1
data:
  train_manifest: data/preprocessed/lol_v2_real.csv
  test_manifests:
  - manifest: data/preprocessed/ex_dark.csv
    group_by: category
  - manifest: data/preprocessed/lol_v1.csv
  - manifest: data/preprocessed/lol_v2_real.csv
  - manifest: data/preprocessed/lol_v2_synthetic.csv
  - manifest: data/preprocessed/mill_s.csv
    group_by: illumination_level
augmentation:
  enabled: true
  horizontal_flip:
    enabled: true
    p: 0.5
  random_resized_crop:
    enabled: true
    output_size: 256
    scale_min: 0.85
    scale_max: 1.0
    ratio_min: 0.95
    ratio_max: 1.05
  color_jitter:
    enabled: true
    p: 0.3
    brightness_min: 0.9
    brightness_max: 1.1
    contrast_min: 0.9
    contrast_max: 1.1
    saturation_min: 0.95
    saturation_max: 1.05
  gamma_jitter:
    enabled: true
    p: 0.3
    gamma_min: 0.85
    gamma_max: 1.15
  sensor_noise:
    enabled: true
    p: 0.2
    sigma_min: 0.0
    sigma_max: 0.015
model:
  name: fac_ecl
  channels:
  - - 32
    - 64
    - 128
    - 256
  normalization: group
  activation: leaky_relu
  group_count: 8
  upsampling: transposed
optimizer:
  lr: 0.0003
  weight_decay: 0.0001
loss:
  name: fac_ecl
  l1_weight: 0.8
  ssim_weight: 0.2
  low_frequency_weight: 0.05
  high_frequency_weight: 0.2
  consistency_weight: 0.2
  frequency_kernel_size: 15
  frequency_sigma: 3.0
  consistency:
    exposure_min: 0.85
    exposure_max: 1.15
    gamma_min: 0.85
    gamma_max: 1.15
    color_temperature_delta: 0.05
    noise_sigma_min: 0.0
    noise_sigma_max: 0.015
training:
  epochs: 999
  validation_rate: 1
  batch_size: 16
  num_workers: 4
  mixed_precision: true
  deterministic: false
early_stopping:
  monitor: ssim
  mode_monitor: max
  min_delta: 0.0001
  patience: 15
  tie_breaker: psnr
  mode_tie_breaker: max
evaluation:
  run_test: false
